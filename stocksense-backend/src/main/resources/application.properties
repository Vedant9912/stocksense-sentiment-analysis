spring.application.name=stocksense-backend

# ---------- MySQL ----------
# All values below fall back to local-dev defaults if the env var isn't set,
# so `mvn spring-boot:run` on your laptop still works without any setup.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# In production this MUST come from an env var (JWT_SECRET) - never ship the
# fallback secret below to a real deployment.
app.jwt.secret=${JWT_SECRET:stocksense-super-secret-key-change-me-please-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- FastAPI AI worker ----------
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}

# ---------- Caching window ----------
# How long a stored sentiment row is considered "fresh" before we re-fetch it
sentiment.cache.minutes=${SENTIMENT_CACHE_MINUTES:15}

server.port=${PORT:8080}
