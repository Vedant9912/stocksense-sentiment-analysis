<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSense -- AI news sentiment for any ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> StockSense</div>
  <div class="topbar-right">
    <span id="username-display"></span>
    <button class="btn btn-ghost" id="logout-btn">Log out</button>
  </div>
</div>

<div class="hero">
  <h1>What does the news think?</h1>
  <p class="sub">Type a ticker. FinBERT reads the latest headlines and tells you the mood.</p>
  <div class="search-row">
    <input type="text" id="ticker-input" placeholder="e.g. RELIANCE, TCS, AAPL" autocomplete="off">
    <button class="btn btn-primary" id="search-btn">Analyze</button>
  </div>
  <div class="chip-row">
    <span class="chip" data-ticker="RELIANCE">RELIANCE</span>
    <span class="chip" data-ticker="TCS">TCS</span>
    <span class="chip" data-ticker="INFY">INFY</span>
    <span class="chip" data-ticker="AAPL">AAPL</span>
    <span class="chip" data-ticker="TSLA">TSLA</span>
  </div>
  <div id="status-line"></div>
</div>

<div id="result-section">
  <div class="result-header">
    <div class="ticker-name" id="result-ticker">--</div>
    <div class="meta" id="result-meta"></div>
  </div>

  <div class="panels">
    <div class="card gauge-card">
      <div class="gauge-label-top">Aggregate mood</div>
      <div class="gauge-wrap">
        <svg viewBox="0 0 220 130" width="220" height="130">
          <defs>
            <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ef4444"/>
              <stop offset="50%" stop-color="#eab308"/>
              <stop offset="100%" stop-color="#22c55e"/>
            </linearGradient>
          </defs>
          <path d="M 10 110 A 100 100 0 0 1 210 110" fill="none" stroke="url(#arcGradient)" stroke-width="14" stroke-linecap="round"/>
          <line id="gauge-needle" x1="110" y1="110" x2="110" y2="30" stroke="#e7ecf3" stroke-width="4" stroke-linecap="round"/>
          <circle cx="110" cy="110" r="7" fill="#e7ecf3"/>
        </svg>
      </div>
      <div class="gauge-readout" id="gauge-label">--</div>
      <div class="gauge-score" id="gauge-score">score: --</div>

      <div class="sentiment-bars">
        <div class="bar-row">
          <span class="bar-label">Bullish</span>
          <div class="bar-track"><div class="bar-fill fill-bullish" id="bar-positive" style="width:0%"></div></div>
          <span class="bar-val" id="val-positive">0%</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">Bearish</span>
          <div class="bar-track"><div class="bar-fill fill-bearish" id="bar-negative" style="width:0%"></div></div>
          <span class="bar-val" id="val-negative">0%</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">Neutral</span>
          <div class="bar-track"><div class="bar-fill fill-neutral" id="bar-neutral" style="width:0%"></div></div>
          <span class="bar-val" id="val-neutral">0%</span>
        </div>
      </div>
    </div>

    <div class="card headlines-card">
      <h3>Headlines analyzed</h3>
      <div class="headline-list" id="headline-list"></div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
