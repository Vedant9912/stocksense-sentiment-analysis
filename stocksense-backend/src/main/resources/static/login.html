<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSense -- Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="dot"></span> StockSense</div>
    <p class="sub">AI-powered news sentiment for any ticker</p>

    <form id="login-form">
      <div class="field">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit">Log in</button>
    </form>

    <form id="register-form" class="hidden">
      <div class="field">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" id="register-submit">Create account</button>
    </form>

    <div id="auth-msg"></div>

    <div class="auth-switch">
      <span id="to-register">New here? <a href="#">Create an account</a></span>
      <span id="to-login" class="hidden">Already have an account? <a href="#">Log in</a></span>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
